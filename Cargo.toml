[workspace]
members = [
    "crates/rekursiv-asm",
    "crates/rekursiv-devices",
    "crates/rekursiv-emulator",
    "crates/rekursiv-model",
    "crates/rekursiv-sim",
    "crates/rekursiv-smalltalk",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

# The native execution loop crosses the processor, object-memory, and device
# crates on each instruction. Optimize those calls together in release builds.
[profile.release]
lto = "thin"
codegen-units = 1

# Optimized tests with debug assertions and overflow checks kept. Guest-image
# and RTL regressions run several times faster than in the dev profile, and
# this compiles much sooner than release because it skips LTO.
#   cargo test --profile quick
[profile.quick]
inherits = "dev"
opt-level = 2
debug = "line-tables-only"
