[package]
name = "rekursiv-smalltalk"
version.workspace = true
edition.workspace = true

[dependencies]
rekursiv-asm = { path = "../rekursiv-asm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
eyre = "0.6"
rekursiv-model = { path = "../rekursiv-model" }
rekursiv-sim = { path = "../rekursiv-sim" }
rekursiv-emulator = { path = "../rekursiv-emulator", default-features = false }
