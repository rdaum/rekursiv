name: Checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install hardware tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator yosys clang build-essential
      - name: Check model, RTL, examples, and synthesis
        run: scripts/check.sh
      - name: Preserve hardware reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-results
          path: |
            artifacts/yosys-synth.log
            artifacts/yosys-logik.log
            artifacts/examples.vcd
